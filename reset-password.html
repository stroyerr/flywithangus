<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Reset Password | Fly With Angus</title>

  <link
    rel="stylesheet"
    href="/styles.css"
  />

  <link
    rel="stylesheet"
    href="/reset-password.css"
  />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script
    src="/reset-password.js"
    defer
  ></script>
</head>


<body class="reset-page">

  <main class="reset-wrapper">

    <section class="reset-card">

      <p class="reset-eyebrow">
        Student Portal
      </p>

      <h1>
        Set a new password
      </h1>

      <p class="reset-description">
        Choose a new password for your Fly With Angus account.
      </p>


      <form id="reset-password-form">

        <div class="reset-field">

          <label for="new-password">
            New password
          </label>

          <input
            id="new-password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          />

        </div>


        <div class="reset-field">

          <label for="confirm-password">
            Confirm password
          </label>

          <input
            id="confirm-password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          />

        </div>


        <button
          id="reset-password-submit"
          class="reset-primary-button"
          type="submit"
        >
          Update password
        </button>


        <p
          id="reset-message"
          class="reset-message"
          role="status"
          aria-live="polite"
        ></p>

      </form>


      <a
        class="reset-return"
        href="/students.html"
      >
        ← Return to student portal
      </a>

    </section>

  </main>

</body>
</html>
